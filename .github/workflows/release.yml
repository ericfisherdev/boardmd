name: Release

# Pushing a tag that matches the manifest version (for example `git tag -a 0.1.0 -m 0.1.0`)
# runs the checks, then creates a draft GitHub release with the files Obsidian installs from.
# Add release notes to the draft and publish it by hand.
on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Keep the contents:write token off disk while npm ci runs dependency install scripts.
      # The release step authenticates through GH_TOKEN instead.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The community directory recommends attesting the release files.
      - name: Attest release files
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --draft --verify-tag main.js manifest.json styles.css
